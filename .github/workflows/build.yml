name: Build DLL

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Clone FFGL SDK
        run: git clone --depth 1 https://github.com/resolume/ffgl.git ${{ github.workspace }}\..\ffgl

      - name: Install GLEW
        run: vcpkg install glew:x64-windows

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Build Release
        run: cmake --build build --config Release

      - name: Stage glew32.dll
        run: Copy-Item "C:/vcpkg/installed/x64-windows/bin/glew32.dll" "build/Release/"

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: X5FisheyeViewer
          path: build/Release/*.dll
